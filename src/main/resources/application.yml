spring:
  application:
    name: internship-network
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/internships}
    username: ${DB_USER:internships}
    password: ${DB_PASSWORD:internships}
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations
    open-in-view: false
  flyway:
    enabled: true
  thymeleaf:
    cache: false
