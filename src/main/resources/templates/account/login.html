<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Log in')}"></head>

<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main>
        <section class="auth-card">
            <h1>Log in</h1>

            <p class="alert alert-success" th:if="${registered}">Account created. Please log in.</p>
            <p class="alert alert-error" th:if="${param.error}" role="alert">
                Incorrect email or password. Please try again.
            </p>

            <form th:action="@{/login}" method="post">
                <div class="form-field">
                    <label for="username">Email</label>
                    <input type="email" id="username" name="username" autocomplete="email" required autofocus>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <button type="submit" class="button-primary">Log in</button>
            </form>

            <p class="auth-switch">New here? <a th:href="@{/register}">Create an account</a></p>
        </section>
    </main>

    <footer class="site-footer">
        <p>LeRateMyInternship</p>
    </footer>
</body>
</html>
