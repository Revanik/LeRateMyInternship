<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>

<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <main>
        <section class="auth-card">
            <h1>Create your account</h1>
            <p class="auth-subtitle">Sign up to post reviews and keep track of your activity.</p>

            <form th:action="@{/register}" th:object="${form}" method="post" novalidate>
                <div class="form-field">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" autocomplete="email" required>
                    <p class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</p>
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" autocomplete="new-password" required>
                    <p class="form-hint">At least 8 characters.</p>
                    <p class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</p>
                </div>

                <div class="form-field">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" autocomplete="new-password" required>
                    <p class="form-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Confirm error</p>
                </div>

                <button type="submit" class="button-primary">Create account</button>
            </form>

            <p class="auth-switch">Already have an account? <a th:href="@{/login}">Log in</a></p>
        </section>
    </main>

    <footer class="site-footer">
        <p>LeRateMyInternship</p>
    </footer>
</body>
</html>
